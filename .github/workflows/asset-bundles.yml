name: Native asset bundles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TIKTOKEN_CACHE_DIR: /tmp/research-fabric-tiktoken
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install bounded renderers
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript
      - name: Install project and pinned native converter
        run: |
          uv venv
          uv pip install -e ".[reading]" pytest ruff -r tests/native-requirements.txt openai-agents==0.17.3 openai==2.44.0
      - name: Provision official tokenizer data for offline reading tests
        run: .venv/bin/python -c 'import tiktoken; tiktoken.get_encoding("cl100k_base")'
      - name: Portable behavior and real renderer regressions
        run: .venv/bin/python -m pytest
      - name: Real native conversion and browser export, no model calls
        run: .venv/bin/python tests/native_asset_smoke.py
      - name: Lint and deterministic grounding self-test
        run: |
          .venv/bin/ruff check src tests tools/wiki bin/dryrun_publication.py
          .venv/bin/ruff format --check src tests tools/wiki bin/dryrun_publication.py
          .venv/bin/python bin/excerpt_grounding.py
          .venv/bin/python -m py_compile workflows/research.py
