name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.os == 'ubuntu-latest' && 'test' || 'test (macos)' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TIKTOKEN_CACHE_DIR: /tmp/research-fabric-tiktoken
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Provision official tokenizer data for offline reading tests
        run: uv run python -c 'import tiktoken; tiktoken.get_encoding("cl100k_base")'

      - name: Run pytest
        run: uv run pytest

      - name: Run the deterministic grounding gate self-test
        run: uv run python bin/excerpt_grounding.py

  native-compile:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      TIKTOKEN_CACHE_DIR: /tmp/research-fabric-tiktoken
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install qualified native compiler and portable engine
        run: |
          uv venv
          uv pip install -e ".[reading]" pytest -r tests/native-requirements.txt
      - name: Provision official tokenizer data for offline reading tests
        run: .venv/bin/python -c 'import tiktoken; tiktoken.get_encoding("cl100k_base")'
      - name: Exercise real native rollback and production retry without credentials
        run: .venv/bin/python -m pytest -vv tests/test_native_compilation.py tests/test_compilation.py tests/test_compile_units.py
