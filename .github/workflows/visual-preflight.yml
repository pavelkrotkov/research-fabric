name: Native visual preflight
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-native-visual:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TIKTOKEN_CACHE_DIR: /tmp/research-fabric-tiktoken
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv venv /tmp/visual-env
      - run: uv pip install --python /tmp/visual-env/bin/python -r tests/visual-requirements.txt -e '.[reading]' pytest
      - run: /tmp/visual-env/bin/python -c 'import tiktoken; tiktoken.get_encoding("cl100k_base")'
      - run: /tmp/visual-env/bin/python -m pytest tests/test_visual_preflight_native.py tests/test_visual_reading_native.py tests/test_derived_context.py tests/test_oauth_execution.py tests/test_one_book_acceptance.py
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
          OPENAI_AGENTS_DONT_LOG_MODEL_DATA: '1'
          OPENAI_AGENTS_DONT_LOG_TOOL_DATA: '1'
