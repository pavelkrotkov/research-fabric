version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        # Only minor/patch action bumps are grouped (and auto-mergeable).
        # Major action upgrades arrive as separate review-only PRs.
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
        # Only minor/patch dependency bumps are grouped (and auto-mergeable).
        # Major upgrades arrive as separate review-only PRs.
        update-types:
          - "minor"
          - "patch"